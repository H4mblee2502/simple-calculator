name: Deploy Calculator to GitHub Pages

on:
  # Runs when you push code to the main branch
  push:
    branches: ["main"]

  # Lets you manually trigger the deployment from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allows only one deployment to run at a time to prevent conflicts
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Files as Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the entire root directory (holds index.html, calcu.css, calcu.js)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4